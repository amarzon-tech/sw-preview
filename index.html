<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Salt Whisperer">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="Salt Whisperer: a quick game to learn which foods are high, moderate, or low in sodium. For people with kidney disease or high blood pressure.">
<title>Salt Whisperer: Sodium Game</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --shadow:0 1.1rem 3.4rem rgba(0,0,0,.35);
    --radius:1.6rem;
    --card:#ffffff; --text:#0f172a; --muted:#475569;
    --high:#b91c1c; --mod:#92400e; --low:#15803d;
    --highBg:#fee2e2; --modBg:#fef3c7; --lowBg:#dcfce7;
    --bgA:#0b1220; --bgB:#17305a; --accent1:#67e8f9; --accent2:#a78bfa;
    --ink:#f1f5f9; --ink2:#dbe4f5;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html{ font-size:100%; }
  html, body { height:100%; margin:0; overflow:hidden; }
  body{ font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color:var(--ink);
    background: linear-gradient(135deg, var(--bgA), var(--bgB)); transition: background 450ms ease; }
  /* Safe area fix: opaque cover above the app so nothing can scroll under the status bar/notch,
     and the scroll container starts below the safe-area padding. */
  .safeCover{ position:fixed; top:0; left:0; right:0; height:var(--sat); background:var(--bgA); z-index:50; pointer-events:none; }
  .shell{ position:fixed; inset:0; padding: var(--sat) var(--sar) var(--sab) var(--sal); display:flex; justify-content:center; overflow:hidden; }
  .app{ width:min(32.5rem,100%); height:100%; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
    display:flex; flex-direction:column; padding:.875rem .875rem 1rem; gap:.625rem; overscroll-behavior:contain; scroll-padding-top:1rem; }
  [hidden]{ display:none !important; }
  .screen{ display:flex; flex-direction:column; gap:.75rem; flex:1 0 auto; }
  :focus-visible{ outline:3px solid #fbbf24; outline-offset:2px; }
  h2[tabindex="-1"]:focus{ outline:none; }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  header{ display:flex; justify-content:space-between; align-items:center; gap:.5rem; padding-top:.25rem; flex:none; }
  .brand{ display:flex; gap:.6rem; align-items:center; min-width:0; }
  .logo{ flex:none; width:2.5rem; height:2.5rem; border-radius:.85rem; background:linear-gradient(135deg,var(--accent1),var(--accent2)); display:grid; place-items:center; font-size:1.4rem; }
  .title h1{ margin:0; font-size:1.125rem; white-space:nowrap; }
  .title p{ margin:.1rem 0 0; font-size:.78rem; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pillDark{ display:inline-flex; align-items:center; gap:.4rem; padding:.4rem .6rem; border-radius:999px; border:1px solid rgba(203,213,225,.3); background:rgba(2,6,23,.45); color:var(--ink); font-size:.78rem; white-space:nowrap; }
  .pillBtn{ cursor:pointer; font:inherit; font-size:.78rem; font-weight:700; }

  .topBars{ display:flex; gap:.5rem; align-items:center; flex:none; position:sticky; top:0; z-index:20; background:var(--bgA); padding:.3rem 0; margin:-.3rem 0 0; }
  .progress{ flex:1; height:.625rem; background:rgba(255,255,255,.15); border-radius:999px; overflow:hidden; }
  .progress > div{ height:100%; width:0%; background:linear-gradient(90deg,var(--accent1),var(--accent2)); border-radius:999px; transition:width .25s ease; }
  .progress.timer > div{ transition:width .1s linear; }
  .iconBtn{ flex:none; background:rgba(2,6,23,.45); color:var(--ink); border:1px solid rgba(203,213,225,.3); border-radius:999px; padding:.4rem .7rem; font-size:.8rem; font-weight:700; }
  .comboChip{ display:inline-flex; align-items:center; gap:.25rem; padding:.3rem .6rem; border-radius:999px; background:rgba(2,6,23,.55); border:1px solid rgba(203,213,225,.3); font-weight:900; font-size:.85rem; white-space:nowrap; }
  .comboChip.hot{ border-color:#fbbf24; box-shadow:0 0 .8rem rgba(251,191,36,.55); }
  .comboChip.max{ border-color:#67e8f9; box-shadow:0 0 1.2rem rgba(103,232,249,.9); }
  #shaker{ display:inline-block; font-size:1.25rem; transform-origin:50% 90%; }
  .shake1{ animation:shk1 .4s ease; } .shake2{ animation:shk2 .45s ease; } .shake3{ animation:shk3 .5s ease; } .shake4{ animation:shk4 .55s ease; } .shake5{ animation:shk5 .6s ease; }
  @keyframes shk1{ 25%{transform:rotate(-14deg)} 75%{transform:rotate(12deg)} }
  @keyframes shk2{ 15%{transform:rotate(-22deg) translateY(-2px)} 45%{transform:rotate(20deg)} 75%{transform:rotate(-14deg)} }
  @keyframes shk3{ 12%{transform:rotate(-28deg) translateY(-3px) scale(1.15)} 36%{transform:rotate(26deg)} 60%{transform:rotate(-20deg)} 82%{transform:rotate(12deg)} }
  @keyframes shk4{ 10%{transform:rotate(-34deg) translateY(-4px) scale(1.25)} 30%{transform:rotate(32deg)} 50%{transform:rotate(-26deg)} 70%{transform:rotate(18deg)} 90%{transform:rotate(-8deg)} }
  @keyframes shk5{ 8%{transform:rotate(-40deg) translateY(-5px) scale(1.4)} 24%{transform:rotate(38deg)} 40%{transform:rotate(-32deg)} 56%{transform:rotate(26deg)} 72%{transform:rotate(-18deg)} 88%{transform:rotate(8deg)} }

  .stack{ position:relative; flex:1; min-height:19rem; }
  .card{ position:absolute; inset:0; background:var(--card); color:var(--text); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:1rem; display:flex; flex-direction:column; gap:.5rem; transition:transform .25s ease, opacity .25s ease, box-shadow .3s ease;
    touch-action:none; overflow:auto; user-select:none; -webkit-user-select:none; }
  .card.revealed{ touch-action:auto; cursor:pointer; }
  .card.glowGood{ box-shadow:0 0 0 .2rem #22c55e, 0 0 2rem rgba(34,197,94,.65); }
  .card.glowBad{ box-shadow:0 0 0 .2rem #f87171, 0 0 1.6rem rgba(248,113,113,.5); }
  .badgeRow{ display:flex; justify-content:space-between; align-items:center; gap:.6rem; }
  .pill{ font-size:.72rem; padding:.35rem .6rem; border-radius:999px; background:#e0e7ff; color:#312e81; font-weight:800; }
  .pill2{ background:#e2e8f0; color:#0f172a; }
  .content{ display:flex; flex-direction:column; align-items:center; gap:.4rem; }
  .emojiTile{ width:6.5rem; height:6.5rem; border-radius:1.5rem; background:#f1f5f9; box-shadow:0 .75rem 1.6rem rgba(15,23,42,.15); display:grid; place-items:center; font-size:3.4rem; }
  .name{ font-size:1.4rem; font-weight:900; letter-spacing:-.02em; text-align:center; }
  .serving{ font-size:.9rem; color:var(--muted); font-weight:700; text-align:center; }
  .prompt{ font-size:.9rem; color:var(--muted); text-align:center; max-width:23rem; }
  .mealList{ width:100%; display:flex; flex-direction:column; gap:.35rem; }
  .mealItem{ background:#f1f5f9; border-radius:.85rem; padding:.5rem .75rem; font-size:.9rem; display:flex; justify-content:space-between; gap:.6rem; align-items:center; }
  .tag{ font-size:.75rem; font-weight:800; padding:.1rem .45rem; border-radius:999px; white-space:nowrap; }
  .tag.high{ background:var(--highBg); color:var(--high); } .tag.mod{ background:var(--modBg); color:var(--mod); } .tag.low{ background:var(--lowBg); color:var(--low); }
  .compare{ display:grid; grid-template-columns:1fr 1fr; gap:.6rem; width:100%; }
  .opt{ background:#f1f5f9; border-radius:1rem; padding:.75rem .5rem; text-align:center; border:3px solid transparent; }
  .opt .e{ font-size:2.4rem; } .opt .n{ font-weight:800; font-size:.92rem; } .opt .s{ font-size:.78rem; color:var(--muted); }
  .opt .mg{ font-size:.85rem; font-weight:800; margin-top:.3rem; }
  .opt.win{ border-color:var(--low); background:var(--lowBg); }
  .opt .letter{ font-size:.75rem; font-weight:900; color:#312e81; }
  .verdict{ border-radius:1rem; padding:.55rem .8rem; text-align:center; font-weight:900; font-size:1.05rem; }
  .verdict.high{ background:var(--highBg); color:var(--high); } .verdict.mod{ background:var(--modBg); color:var(--mod); } .verdict.low{ background:var(--lowBg); color:var(--low); }
  .verdict small{ display:block; font-weight:700; font-size:.82rem; color:var(--text); margin-top:.15rem; }
  .hint{ font-size:.78rem; color:var(--muted); text-align:center; margin-top:auto; }
  .overlay{ position:absolute; top:.85rem; padding:.55rem .85rem; border-radius:1rem; font-weight:900; opacity:0; pointer-events:none; }
  .overlay.left{ left:.85rem; background:var(--highBg); color:var(--high); border:2px solid var(--high); }
  .overlay.up{ left:50%; transform:translateX(-50%); background:var(--modBg); color:var(--mod); border:2px solid var(--mod); }
  .overlay.right{ right:.85rem; background:var(--lowBg); color:var(--low); border:2px solid var(--low); }

  .controls{ display:flex; gap:.6rem; flex:none; }
  button{ font:inherit; cursor:pointer; }
  .controls button, .bigBtn{ flex:1; border:0; border-radius:999px; padding:.8rem .5rem; font-weight:900; font-size:.9rem; line-height:1.2; transition:transform .08s ease; }
  .controls button:active, .bigBtn:active{ transform:scale(.98); }
  .controls button small{ display:block; font-weight:700; font-size:.72rem; opacity:.95; }
  .controls button:disabled{ opacity:.45; cursor:default; }
  .btnHigh{ background:var(--highBg); color:var(--high); } .btnMod{ background:var(--modBg); color:var(--mod); } .btnLow{ background:var(--lowBg); color:var(--low); }
  .btnA{ background:#e0e7ff; color:#312e81; }
  .bigBtn{ background:linear-gradient(135deg,var(--accent1),var(--accent2)); color:#0b1220; padding:.95rem; font-size:1rem; }
  .bigBtn.secondary{ background:rgba(2,6,23,.45); color:var(--ink); border:1px solid rgba(203,213,225,.35); }
  .bigBtn small{ display:block; font-weight:700; font-size:.75rem; opacity:.85; }

  .toast{ background:rgba(2,6,23,.7); border:2px solid rgba(203,213,225,.3); padding:.75rem .85rem; border-radius:1.1rem; font-size:.88rem; line-height:1.4; flex:none; max-height:40vh; overflow:auto; }
  .toast.good{ border-color:#22c55e; } .toast.bad{ border-color:#f87171; }
  .toast .swap{ margin-top:.3rem; color:#bbf7d0; }
  .toast .coach{ margin-top:.35rem; color:var(--ink2); font-size:.82rem; font-style:italic; }
  .toast .row{ display:flex; gap:.6rem; align-items:center; justify-content:space-between; margin-top:.6rem; }
  .toast .tapnote{ font-size:.75rem; color:var(--ink2); }
  .nextBtn{ border:0; border-radius:999px; padding:.65rem 1.4rem; font-weight:900; background:#f8fafc; color:#0b1220; }
  .footer{ font-size:.72rem; color:var(--ink2); text-align:center; flex:none; padding-top:.25rem; }
  .footer a, .panelText a{ color:#bfdbfe; }
  .draft{ display:inline-block; margin-top:.2rem; padding:.1rem .5rem; border-radius:999px; background:rgba(251,191,36,.18); color:#fde68a; font-weight:700; }

  .panel{ border-radius:1.4rem; padding:1rem; color:var(--ink); border:1px solid rgba(203,213,225,.25); background:rgba(2,6,23,.55); box-shadow:var(--shadow); }
  .panel h2{ margin:0 0 .4rem; font-size:1.25rem; }
  .panel h3{ margin:.8rem 0 .3rem; font-size:1rem; }
  .panel p, .panel li{ font-size:.9rem; line-height:1.45; color:var(--ink2); }
  .panel ul{ padding-left:1.1rem; margin:.3rem 0; }
  .big{ font-size:2.5rem; font-weight:900; margin:.3rem 0; }
  .btnCol{ display:flex; flex-direction:column; gap:.6rem; }
  .btnRow{ display:flex; gap:.6rem; }
  .modeGrid{ display:grid; grid-template-columns:1fr 1fr; gap:.6rem; }
  .modeBtn{ border:1px solid rgba(203,213,225,.3); background:rgba(2,6,23,.5); color:var(--ink); border-radius:1.2rem; padding:.8rem .6rem; text-align:left; font-weight:900; font-size:.95rem; display:flex; flex-direction:column; gap:.15rem; }
  .modeBtn small{ font-weight:600; font-size:.74rem; color:var(--ink2); }
  .modeBtn .me{ font-size:1.6rem; }
  .dailyBtn{ border:0; background:linear-gradient(135deg,#22c55e,#67e8f9); color:#06231a; border-radius:1.3rem; padding:1rem; text-align:left; font-weight:900; font-size:1.05rem; display:flex; gap:.7rem; align-items:center; }
  .dailyBtn small{ display:block; font-weight:700; font-size:.78rem; }
  .dailyBtn .me{ font-size:2rem; }
  .toggles{ display:flex; gap:.6rem; flex-wrap:wrap; justify-content:center; }
  .toggle{ background:rgba(2,6,23,.45); color:var(--ink); border:1px solid rgba(203,213,225,.35); border-radius:999px; padding:.5rem .9rem; font-weight:700; font-size:.85rem; }
  .toggle[aria-pressed="false"]{ opacity:.75; text-decoration:line-through; }
  .toggle.sel{ background:var(--ink); color:#0b1220; }
  .statGrid{ display:grid; grid-template-columns:1fr 1fr; gap:.5rem; }
  .stat{ background:rgba(255,255,255,.08); border-radius:.9rem; padding:.6rem; text-align:center; }
  .stat b{ display:block; font-size:1.3rem; color:#fff; } .stat span{ font-size:.78rem; color:var(--ink2); }
  .levelRow{ display:flex; justify-content:space-between; gap:.5rem; padding:.35rem 0; border-bottom:1px solid rgba(203,213,225,.15); font-size:.9rem; }
  .xpBar{ height:.55rem; border-radius:999px; background:rgba(255,255,255,.15); overflow:hidden; margin-top:.35rem; }
  .xpBar > div{ height:100%; background:linear-gradient(90deg,#fbbf24,#fb923c); border-radius:999px; transition:width .9s ease; }
  .badgeGrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:.4rem; }
  .bdg{ background:rgba(255,255,255,.07); border-radius:.9rem; padding:.45rem .2rem; text-align:center; font-size:.62rem; color:var(--ink2); line-height:1.15; }
  .bdg .be{ font-size:1.5rem; display:block; filter:grayscale(1); opacity:.4; }
  .bdg.got{ background:rgba(251,191,36,.15); color:#fff; } .bdg.got .be{ filter:none; opacity:1; }
  .modal{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:calc(1rem + var(--sat)) 1rem calc(1rem + var(--sab)); background:rgba(0,0,0,.6); z-index:60; overflow:auto; }
  .modal .panel{ width:min(32.5rem,100%); background:#111a33; text-align:center; max-height:100%; overflow:auto; }
  .rankLine{ display:flex; justify-content:center; align-items:center; gap:.6rem; margin:.5rem 0; flex-wrap:wrap; }
  .newBadge{ display:inline-flex; gap:.35rem; align-items:center; padding:.3rem .6rem; margin:.15rem; border-radius:999px; background:rgba(251,191,36,.2); border:1px solid #fbbf24; font-weight:800; font-size:.8rem; }
  .record{ color:#fde68a; font-weight:900; animation:pop .6s ease; }
  @keyframes pop{ from{transform:scale(.6);opacity:0} 60%{transform:scale(1.15)} to{transform:scale(1);opacity:1} }
  .fx{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:70; }
  .crys{ position:absolute; width:.55rem; height:.55rem; background:linear-gradient(135deg,#fff,#bfdbfe); clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%); box-shadow:0 0 .4rem #fff; will-change:transform,opacity; }
  .floatTxt{ position:absolute; font-weight:900; font-size:1.3rem; color:#fde68a; text-shadow:0 0 .6rem rgba(0,0,0,.6); will-change:transform,opacity; }
  .banner{ position:absolute; left:50%; top:22%; transform:translateX(-50%); font-weight:900; font-size:1.6rem; padding:.4rem 1rem; border-radius:999px; background:rgba(2,6,23,.75); border:2px solid #fbbf24; color:#fde68a; white-space:nowrap; }
  .conf{ position:absolute; font-size:1.5rem; animation:fall 900ms ease-out forwards; }
  @keyframes fall{ from{ transform:translateY(-20px) rotate(0); opacity:0; } 20%{ opacity:1; } to{ transform:translateY(260px) rotate(220deg); opacity:0; } }

  /* Daily Budget meter */
  .meterWrap{ position:relative; padding:.2rem 0 1.1rem; }
  .meter{ position:relative; height:1.6rem; border-radius:999px; background:rgba(255,255,255,.14); overflow:visible; }
  .meterFill{ position:absolute; left:0; top:0; bottom:0; width:0; border-radius:999px; background:linear-gradient(90deg,#22c55e,#86efac); transition:width .9s cubic-bezier(.2,.9,.2,1), background .4s ease, box-shadow .4s ease; }
  .meter.under .meterFill{ box-shadow:0 0 1.2rem rgba(34,197,94,.9), 0 0 .4rem #bbf7d0 inset; animation:glowPulse 1.8s ease-in-out infinite; }
  .meter.warn .meterFill{ background:linear-gradient(90deg,#f59e0b,#fde68a); box-shadow:0 0 1rem rgba(245,158,11,.7); }
  .meter.over .meterFill{ background:linear-gradient(90deg,#ef4444,#fca5a5); box-shadow:0 0 1rem rgba(239,68,68,.7); }
  @keyframes glowPulse{ 50%{ box-shadow:0 0 1.9rem rgba(34,197,94,1), 0 0 .6rem #dcfce7 inset; } }
  .meterMark{ position:absolute; top:-.3rem; bottom:-.3rem; width:3px; background:#fff; border-radius:2px; }
  .meterMark span{ position:absolute; top:100%; left:50%; transform:translateX(-50%); font-size:.66rem; white-space:nowrap; margin-top:.15rem; color:var(--ink2); }
  .meterTxt{ display:flex; justify-content:space-between; font-size:.85rem; margin-top:.2rem; }
  .flatCard{ background:var(--card); color:var(--text); border-radius:var(--radius); box-shadow:var(--shadow); padding:1rem; display:flex; flex-direction:column; gap:.6rem; transition:box-shadow .3s ease; }
  .flatCard.glowGood{ box-shadow:0 0 0 .2rem #22c55e, 0 0 2rem rgba(34,197,94,.65); } .flatCard.glowBad{ box-shadow:0 0 0 .2rem #f87171, 0 0 1.6rem rgba(248,113,113,.5); }
  .optGrid{ display:flex; flex-direction:column; gap:.55rem; }
  .optCard{ display:flex; gap:.7rem; align-items:center; text-align:left; background:#fff; color:var(--text); border:3px solid transparent; border-radius:1.2rem; padding:.7rem .8rem; font-weight:800; box-shadow:0 .5rem 1.4rem rgba(0,0,0,.25); width:100%; }
  .optCard .oe{ font-size:2.2rem; flex:none; }
  .optCard small{ display:block; font-weight:600; color:var(--muted); font-size:.78rem; }
  .optCard .omg{ margin-left:auto; text-align:right; font-weight:900; font-size:.95rem; white-space:nowrap; }
  .optCard.chosen{ border-color:#0ea5e9; } .optCard.dim{ opacity:.75; }
  .optCard:disabled{ cursor:default; }
  .partBtn{ display:flex; align-items:center; gap:.6rem; width:100%; text-align:left; background:#f1f5f9; border:3px solid transparent; border-radius:1rem; padding:.7rem .8rem; font-weight:800; color:var(--text); }
  .partBtn .pbar{ flex:1; height:.5rem; border-radius:999px; background:#e2e8f0; overflow:hidden; display:none; }
  .partBtn .pbar i{ display:block; height:100%; background:#ef4444; width:0; transition:width .7s ease; }
  .partBtn .pmg{ font-size:.85rem; display:none; white-space:nowrap; }
  .partBtn.top{ border-color:#ef4444; background:#fee2e2; } .partBtn.mine{ border-color:#0ea5e9; }
  .sliderBox{ width:100%; } .sliderBox input[type=range]{ width:100%; height:2rem; accent-color:#0ea5e9; }
  .gBig{ font-size:2rem; font-weight:900; text-align:center; }
  .gSub{ text-align:center; font-size:.85rem; color:var(--muted); }
  .twoBar{ width:100%; display:flex; flex-direction:column; gap:.35rem; margin-top:.3rem; }
  .twoBar div{ display:flex; align-items:center; gap:.5rem; font-size:.8rem; font-weight:800; }
  .twoBar i{ display:block; height:.7rem; border-radius:999px; background:#0ea5e9; width:0; transition:width .7s ease; } .twoBar i.act{ background:#ef4444; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } .fx,.confetti{ display:none; } }
</style>
</head>
<body>
<div class="safeCover" id="safeCover" aria-hidden="true"></div>
<div class="shell">
  <main class="app" id="app">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">🧂</div>
        <div class="title"><h1>Salt Whisperer</h1><p id="subtitle">Sodium game</p></div>
      </div>
      <button class="pillDark pillBtn" id="profilePill" hidden aria-label="Change profile in settings"></button>
    </header>

    <div class="topBars" id="topBar" hidden>
      <button class="iconBtn" id="homeBtn" aria-label="Back to menu">⌂ Menu</button>
      <div class="progress" id="progWrap" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><div id="prog"></div></div>
      <span class="pillDark" id="timeChip" hidden>60s</span>
      <span class="comboChip" id="comboChip" aria-live="off"><span id="shaker" aria-hidden="true">🧂</span><b id="comboTxt">x1</b></span>
      <span class="pillDark" id="ptsPill"><b id="ptsTxt">0</b> pts</span>
    </div>

    <section class="screen" id="homeScreen" aria-label="Menu"></section>

    <section class="screen" id="gameScreen" hidden aria-label="Swipe game">
      <div class="stack" id="stack"></div>
      <div class="controls" id="controls">
        <button class="btnHigh" id="highBtn">⬅ High<small>swipe left</small></button>
        <button class="btnMod" id="modBtn">⬆ Moderate<small>swipe up</small></button>
        <button class="btnLow" id="lowBtn">Low ➡<small>swipe right</small></button>
      </div>
      <div class="toast" id="toast" hidden></div>
    </section>
